name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node

  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Fail if the tarball holds raw-data or SQLite sidecar files
        run: |
          if tar -tzf ./*.tgz | grep -E 'raw-data|\.db-(wal|shm)'; then
            echo 'tarball contains raw-data or a -wal/-shm file' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: certsafary-tarball
          path: '*.tgz'
          retention-days: 14
